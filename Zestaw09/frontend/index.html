<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>ModaBot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .app {
      width: 420px;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px #0002;
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
    }

    #chat {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      background: #fafafa;
      margin-bottom: 12px;
    }

    .msg {
      padding: 10px;
      margin: 8px 0;
      border-radius: 10px;
      max-width: 80%;
    }

    .user {
      background: #222;
      color: white;
      margin-left: auto;
    }

    .bot {
      background: #e5e5e5;
      color: #222;
      margin-right: auto;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 10px 14px;
      background: #222;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    .quick {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .quick button {
      background: white;
      color: #222;
      border: 1px solid #ccc;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1> ModaBot</h1>

    <div id="chat">
      <div class="msg bot">Cześć! Jestem asystentem sklepu odzieżowego. W czym mogę pomóc?</div>
    </div>

    <div class="row">
      <input id="msg" placeholder="Napisz wiadomość..." />
      <button onclick="sendMessage()">Wyślij</button>
    </div>
  </div>

  <script>
    const API = "http://localhost:5000";

    function addMessage(text, type) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("msg");
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      try {
        const res = await fetch(`${API}/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();

        if (data.reply) {
          addMessage(data.reply, "bot");
        } else {
          addMessage("Brak odpowiedzi z serwera.", "bot");
        }

      } catch (err) {
        addMessage("Nie mogę połączyć się z backendem na porcie 5000.", "bot");
      }
    }

    function quick(text) {
      document.getElementById("msg").value = text;
      sendMessage();
    }

    document.getElementById("msg").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>

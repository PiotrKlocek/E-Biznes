services:
  backend:
    build: ./server
    container_name: shop-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - db-data:/data
    environment:
      - PORT=8080
      - DB_PATH=/data/shop.db
      - ALLOWED_ORIGIN=${FRONTEND_URL:-http://localhost:5173}

  frontend:
    build:
      context: ./shop-client
      args:
        - VITE_API_URL=${BACKEND_URL:-http://localhost:8080}
    container_name: shop-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
